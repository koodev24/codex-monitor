name: Release v2 (Tauri)

# Releases are cut by pushing a v2* tag. The job sequence keeps the release
# draft until every platform has uploaded, then normalizes the asset names,
# regenerates latest.json, and publishes exactly once.
on:
  push:
    tags:
      - 'v2*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$draft" != "true" ]; then
              echo "::error::Release $tag is already published. Cut a new version instead of mutating it."
              exit 1
            fi
            echo "Draft release $tag already exists."
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Codex Monitor ${tag#v}" \
              --notes "Release notes are generated when every build finishes."
          fi
          echo "release_id=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ''
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: ''

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && matrix.rust_target || '' }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Resolve App Version from tag
        working-directory: apps/desktop
        run: node ../../scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Typecheck + unit tests (frontend shape)
        working-directory: apps/desktop
        run: |
          npm run build
          npm test

      - name: Rust tests + clippy
        working-directory: apps/desktop/src-tauri
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Build and upload bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  finalize:
    needs: [prepare, build]
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize assets and write updater feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          TAG: ${{ github.ref_name }}
        run: node scripts/finalize-release.mjs

      - name: Write checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sums="CodexMonitor-${version}-SHA256SUMS.txt"
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist --clobber
          cd dist
          find . -maxdepth 1 -type f \
            ! -name '*.sig' \
            ! -name 'latest.json' \
            ! -name '*SHA256SUMS.txt' \
            -print \
            | LC_ALL=C sort \
            | while IFS= read -r file; do shasum -a 256 "$file"; done \
            | sed 's|  \./|  |' > "$sums"
          gh release upload "$GITHUB_REF_NAME" "$sums" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --title "Codex Monitor ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md
