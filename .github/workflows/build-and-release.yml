name: Build and Release Apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve App Version
        run: |
          echo "CODEX_MONITOR_VERSION=$(python -c 'from codex_monitor_app.version import get_build_version; print(get_build_version())')" >> "$GITHUB_ENV"

      - name: Build macOS App with PyInstaller
        run: |
          pyinstaller --noconfirm CodexMonitor.spec

      - name: Zip the .app bundle
        run: |
          cd dist
          zip -r CodexMonitor-macOS.zip CodexMonitor.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexMonitor-macOS
          path: dist/CodexMonitor-macOS.zip

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve App Version
        run: |
          "CODEX_MONITOR_VERSION=$(python -c 'from codex_monitor_app.version import get_build_version; print(get_build_version())')" >> $env:GITHUB_ENV

      - name: Build Windows App with PyInstaller
        run: |
          pyinstaller --noconfirm CodexMonitor.spec

      - name: Zip the executable
        run: |
          Compress-Archive -Path dist/CodexMonitor.exe -DestinationPath dist/CodexMonitor-Windows.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexMonitor-Windows
          path: dist/CodexMonitor-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - build-mac
      - build-windows

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/**/*.zip
          generate_release_notes: true
